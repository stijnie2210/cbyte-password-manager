services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cbyte
      POSTGRES_PASSWORD: cbyte
      POSTGRES_DB: password_sharing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbyte"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
